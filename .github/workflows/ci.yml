name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: bash scripts/ci-test.sh
      - name: Secret scan (basic)
        run: |
          if git grep -E 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- ':!docs/**' ':!*.md'; then
            echo "Possible private key committed" >&2
            exit 1
          fi
