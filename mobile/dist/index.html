<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>My Mobile IDE</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="auth-screen" class="screen hidden" aria-label="Authentication">
        <div class="card">
          <h1>My Mobile IDE</h1>
          <p class="muted">Phase 02 POC — sign in to open the workbench</p>
          <label class="field">
            <span>Access token</span>
            <input id="auth-token" type="password" autocomplete="off" placeholder="Enter session token" />
          </label>
          <p id="auth-error" class="error hidden" role="alert"></p>
          <button id="auth-submit" type="button">Continue</button>
          <p class="hint">POC only: any non-empty token is accepted and stored securely on device.</p>
        </div>
      </section>
      <section id="loading-screen" class="screen" aria-label="Loading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-message">Starting…</p>
      </section>
      <section id="error-screen" class="screen hidden" aria-label="Error">
        <div class="card">
          <h2>Connection issue</h2>
          <p id="error-message" class="muted"></p>
          <div class="row">
            <button id="error-retry" type="button">Retry</button>
            <button id="error-signout" type="button" class="secondary">Sign out</button>
          </div>
        </div>
      </section>
      <section id="workbench-screen" class="screen hidden" aria-label="Workbench">
        <header id="shell-header">
          <span id="shell-title">My Mobile IDE</span>
          <span id="shell-status" class="status">idle</span>
          <button id="shell-signout" type="button" class="ghost" title="Sign out">Sign out</button>
        </header>
        <iframe id="workbench-frame" title="Code - OSS Web Workbench"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"
          allow="clipboard-read; clipboard-write"></iframe>
      </section>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
